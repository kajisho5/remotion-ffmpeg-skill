name: release

# Two ways to release, both on a push to main:
#   - By hand: bump "version" in package.json (and .claude-plugin/plugin.json) and add a
#     "## X.Y.Z" section to CHANGELOG.md. This job tags vX.Y.Z, publishes a GitHub Release with
#     that section as notes, and publishes to npm (when the NPM_TOKEN secret exists).
#   - Automatically: when the version is already tagged, .github/scripts/resolve_version.py reads
#     what was merged since that tag (PR labels, or feat:/fix: commit subjects for direct pushes)
#     and, for a minor/patch change, bumps both version files, writes the CHANGELOG section and
#     pushes that commit ("release: vX.Y.Z [skip ci]") before tagging. Unlabelled changes,
#     docs/ci/chore only, release nothing; a major change is refused (bump it by hand).
# A push that does not change the version does nothing -- except publishing to npm when that
# version is not on npm yet (e.g. the NPM_TOKEN secret was added after the GitHub Release):
# run this workflow by hand from the Actions tab to publish it.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read   # resolve_version.py reads merged PRs' labels
  id-token: write       # npm publish --provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # the tip, so an automatic bump commits on top of everything merged
          fetch-depth: 0

      - name: Automatic version bump (when the current version is already tagged)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if ! git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION not tagged yet: releasing the hand-bumped version"
            exit 0
          fi
          read -r BUMP NEXT < <(python3 .github/scripts/resolve_version.py --notes auto-notes.md)
          if [ "$BUMP" = "none" ]; then
            echo "nothing since v$VERSION calls for a release"
            exit 0
          fi
          python3 - "$NEXT" <<'EOF'
          import datetime, json, sys
          nxt = sys.argv[1]
          for path in ("package.json", ".claude-plugin/plugin.json"):
              data = json.load(open(path, encoding="utf-8"))
              data["version"] = nxt
              open(path, "w", encoding="utf-8").write(json.dumps(data, indent=2, ensure_ascii=False) + "\n")
          notes = open("auto-notes.md", encoding="utf-8").read()
          today = datetime.date.today().isoformat()
          log = open("CHANGELOG.md", encoding="utf-8").read()
          head = "# Changelog\n"
          section = f"## {nxt} — {today}\n\n_Automated release: version and notes from what was merged since the previous tag._\n\n{notes}\n"
          log = log.replace(head, head + "\n" + section, 1) if log.startswith(head) else section + log
          open("CHANGELOG.md", "w", encoding="utf-8").write(log)
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "release: v$NEXT [skip ci]"
          git push origin HEAD:main

      - name: Is this version released yet?
        id: v
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "v$VERSION already tagged: nothing to release"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Release notes from CHANGELOG.md
        if: steps.v.outputs.release == 'true'
        run: |
          python3 - "${{ steps.v.outputs.version }}" <<'EOF'
          import re, sys
          v = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^## {re.escape(v)}\b.*?$(.*?)(?=^## |\Z)", text, re.S | re.M)
          if not m:
              sys.exit(f"CHANGELOG.md has no '## {v}' section: add one in the PR that bumps the version")
          open("release-notes.md", "w", encoding="utf-8").write(m.group(1).strip() + "\n")
          EOF

      - name: Tag and GitHub Release
        if: steps.v.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="v${{ steps.v.outputs.version }}"
          git tag "$V"
          git push origin "$V"
          gh release create "$V" --title "$V" --notes-file release-notes.md

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm (when this version is not on npm yet)
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          V="${{ steps.v.outputs.version }}"
          if npm view "remotion-ffmpeg-skill@$V" version >/dev/null 2>&1; then
            echo "remotion-ffmpeg-skill@$V is already on npm"
            exit 0
          fi
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::notice::NPM_TOKEN secret is not set: skipped npm publish (GitHub Release was made)"
            exit 0
          fi
          # npm keeps a fresh publish "staged" for a few minutes, during which `npm view` does not see it yet:
          # a push right after a release then tries the same version again and gets E409. That is not a failure.
          if ! npm publish --provenance --access public 2>&1 | tee publish.log; then
            if grep -qiE "previously (staged|published)|cannot publish over" publish.log; then
              echo "::notice::remotion-ffmpeg-skill@$V is already on npm (staged by an earlier run)"
              exit 0
            fi
            exit 1
          fi
